<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f3e8"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.png"><link rel="stylesheet" href="/style.css"><title>スリープしない君</title><main><img src="/icon.png" width="90" height="90" alt="Mac君"><h1>スリープしない君</h1><p id="help">iPhoneの共有メニューから「ホーム画面に追加」し、そのアイコンから開いてください。</p><section id="setup" hidden><p>Macの「専用アプリ接続」に出ている登録コードを貼り付けてください。ホーム画面への追加後に登録します。</p><button id="scan">MacのQRを読み取る</button><video id="camera" playsinline muted hidden></video><label>登録コード<input id="pair" autocomplete="off" spellcheck="false"></label><button id="register">通知を許可して登録</button></section><section id="controls" hidden><p>このiPhoneと接続したMacだけを操作します。</p><button id="off">スリープ防止をオフにする</button><p>Macが指示を受信してオフを確認するまで、完了にはなりません。指示は2分で期限切れになります。</p></section><p id="status" role="status"></p></main><script src="/jsQR.js" defer></script><script src="/app.js" defer></script></html>
